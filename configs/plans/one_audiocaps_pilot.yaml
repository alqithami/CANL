campaign_id: caenl-audiocaps-pilot-v1
campaign_role: pilot
results_root: "${CAENL_RESULTS_ROOT:-/dev/shm/caenl-active/results}"
data_root: "${CAENL_DATA_ROOT:-/dev/shm/caenl-active/data}"
cache_root: "${CAENL_CACHE_ROOT:-/dev/shm/caenl-active/cache}"
protocol: configs/protocol/revision_protocol.yaml
report_after_each_stage: true
publication_gate: true
hardware: {expected_gpu_name_regex: "L40S", min_gpu_memory_gb: 44, min_system_memory_gb: 108, min_logical_cpus: 20, min_nvidia_driver: 550, torch_cuda: "12.4"}
preflight: {require_gpu: true, min_free_gb: 15}
defaults:
  audio:
    dataset: audiocaps
    manifest: "${CAENL_DATA_ROOT:-/dev/shm/caenl-active/data}/audiocaps/manifest.jsonl"
    manifest_min_coverage: 0.60
    manifest_verify_hashes: sample
    max_clips_per_split: 1000
    captioning:
      decoder: gpt2
      prefix_length: 8
      epochs: 3
      batch_size: 16
      lr: 0.0001
      beam_size: 3
      max_new_tokens: 30
      metrics: [cider_d, bleu4, rouge_l, meteor, spice, validation_loss]
      official_metrics: true
      java_metrics: true
      spice: true
      checkpoint_every_steps: 100
    retrieval:
      text_encoder: sentence-transformers/all-MiniLM-L6-v2
      embed_dim: 512
      epochs: 5
      batch_size: 64
      lr: 0.0003
      temperature_init: 0.07
      metrics: [t2a_r1, t2a_r5, t2a_r10, a2t_r1, a2t_r5, a2t_r10, median_rank]
      checkpoint_every_steps: 100
    configured_rank: 64
    monitoring_cadence_steps: 10
  full_macc:
    reward_baseline_ema: 0.10
    reward: {validation_delta_weight: 1.0, validation_delta_scale: 2.0, value_delta_clip: 0.5, query_penalty_beta: 0.0, target_deviation_gamma: 0.05}
  quality_gates: {require_controller_updates: true, minimum_controller_updates: 3}
stages:
  - name: prepare_audiocaps
    type: prepare_data
    cpu_only: true
    parallel: 1
    matrix: {}
    job:
      datasets:
        - name: audiocaps
          options:
            download_audio: true
            download_workers: 4
            max_clips_per_split: 1000
            min_coverage: 0.60
            cookies: "${CAENL_YTDLP_COOKIES:-}"
  - name: captioning_pilot
    type: audio_captioning
    depends_on: [prepare_audiocaps]
    parallel: 1
    matrix: {seed: [101, 102], method: [baseline, fixed_dcr, macc_lite, full_macc]}
    expected: {seeds: [101, 102], methods: [baseline, fixed_dcr, macc_lite, full_macc]}
    job: {}
  - name: retrieval_pilot
    type: audio_retrieval
    depends_on: [prepare_audiocaps]
    parallel: 1
    matrix: {seed: [101, 102], method: [baseline, fixed_dcr, macc_lite, full_macc]}
    expected: {seeds: [101, 102], methods: [baseline, fixed_dcr, macc_lite, full_macc]}
    job: {}
  - name: aggregate
    type: aggregate
    depends_on: [captioning_pilot, retrieval_pilot]
    cpu_only: true
    matrix: {}
    job: {}
