campaign_id: ibm-l40s-c4
results_root: "${CAENL_RESULTS_ROOT:-/mnt/caenl/results}"
data_root: "${CAENL_DATA_ROOT:-/mnt/caenl/data}"
cache_root: "${CAENL_CACHE_ROOT:-/mnt/caenl/cache}"
protocol: configs/protocol/revision_protocol.yaml
report_after_each_stage: true
publication_gate: true
hardware: {expected_gpu_name_regex: "L40S", min_gpu_memory_gb: 44, min_system_memory_gb: 108, min_logical_cpus: 20, min_nvidia_driver: 550, torch_cuda: "12.4"}
preflight: {require_gpu: true, min_free_gb: 150}
defaults:
  language: {dataset: allenai/c4, subset: en, model: gpt2, init: pretrained, sequence_length: 1024, train_tokens: 100000000, validation_tokens: 2000000, batch_tokens: 8192, lr: 0.00005, dcr_token_subsample: 2048, eval_every_steps: 500, checkpoint_every_steps: 500, log_every_steps: 25}
stages:
  - name: prepare_c4
    type: prepare_data
    cpu_only: true
    parallel: 1
    matrix:
      dataset_spec:
        - {name: c4, options: {tokenizer: gpt2, train_shards: ["en/c4-train.00000-of-01024.json.gz"], validation_shards: ["en/c4-validation.00000-of-00008.json.gz"], sequence_length: 1024, train_tokens: 100000000, validation_tokens: 2000000}}
    job: {}
  - name: c4
    type: language_c4
    depends_on: [prepare_c4]
    parallel: 1
    matrix: {seed: [0, 1, 2], method: [baseline, fixed_dcr, macc_lite, full_macc]}
    expected: {seeds: [0, 1, 2], methods: [baseline, fixed_dcr, macc_lite, full_macc]}
    job: {}
  - name: aggregate
    type: aggregate
    depends_on: [c4]
    cpu_only: true
    matrix: {}
    job: {}
