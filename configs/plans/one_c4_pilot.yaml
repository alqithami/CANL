campaign_id: caenl-c4-pilot-v1
campaign_role: pilot
results_root: "${CAENL_RESULTS_ROOT:-/dev/shm/caenl-active/results}"
data_root: "${CAENL_DATA_ROOT:-/dev/shm/caenl-active/data}"
cache_root: "${CAENL_CACHE_ROOT:-/dev/shm/caenl-active/cache}"
protocol: configs/protocol/revision_protocol.yaml
report_after_each_stage: true
publication_gate: true
hardware:
  expected_gpu_name_regex: "L40S"
  min_gpu_memory_gb: 44
  min_system_memory_gb: 108
  min_logical_cpus: 20
  min_nvidia_driver: 550
  torch_cuda: "12.4"
preflight:
  require_gpu: true
  min_free_gb: 8
defaults:
  statistics:
    minimum_paired_seeds_for_inference: 3
  language:
    dataset: allenai/c4
    subset: en
    model: gpt2
    init: pretrained
    sequence_length: 1024
    train_tokens: 10000000
    validation_tokens: 500000
    batch_tokens: 8192
    lr: 0.00005
    weight_decay: 0.01
    warmup_steps: 100
    dcr_token_subsample: 2048
    configured_rank: 192
    target_effective_rank: 128
    monitoring_cadence_steps: 25
    eval_every_steps: 250
    checkpoint_every_steps: 250
    log_every_steps: 25
  macc_lite:
    eta_lambda: 0.002
    lambda_initial: 0.03
    lambda_min: 0.0
    lambda_max: 0.25
  full_macc:
    lambda_initial: 0.03
    lambda_min: 0.0
    lambda_max: 0.25
    reward_baseline_ema: 0.10
    reward:
      validation_delta_weight: 1.0
      validation_delta_scale: 2.0
      value_delta_clip: 0.5
      query_penalty_beta: 0.0
      target_deviation_gamma: 0.05
  quality_gates:
    require_controller_updates: true
    minimum_controller_updates: 5
stages:
  - name: prepare_c4
    type: prepare_data
    cpu_only: true
    parallel: 1
    matrix:
      dataset_spec:
        - name: c4
          options:
            tokenizer: gpt2
            train_shards: ["en/c4-train.00000-of-01024.json.gz"]
            validation_shards: ["en/c4-validation.00000-of-00008.json.gz"]
            sequence_length: 1024
            train_tokens: 10000000
            validation_tokens: 500000
    job: {}
  - name: c4_pilot
    type: language_c4
    depends_on: [prepare_c4]
    parallel: 1
    matrix:
      seed: [101, 102]
      method: [baseline, fixed_dcr, macc_lite, full_macc]
    expected:
      seeds: [101, 102]
      methods: [baseline, fixed_dcr, macc_lite, full_macc]
    job: {}
  - name: aggregate
    type: aggregate
    depends_on: [c4_pilot]
    cpu_only: true
    matrix: {}
    job: {}
