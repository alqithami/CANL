campaign_id: caenl-audiocaps-confirmatory-v1
campaign_role: confirmatory
results_root: "${CAENL_RESULTS_ROOT:-/dev/shm/caenl-active/results}"
data_root: "${CAENL_DATA_ROOT:-/dev/shm/caenl-active/data}"
cache_root: "${CAENL_CACHE_ROOT:-/dev/shm/caenl-active/cache}"
protocol: configs/protocol/revision_protocol.yaml
report_after_each_stage: true
publication_gate: true
hardware: {expected_gpu_name_regex: "L40S", min_gpu_memory_gb: 44, min_system_memory_gb: 108, min_logical_cpus: 20, min_nvidia_driver: 550, torch_cuda: "12.4"}
preflight: {require_gpu: true, min_free_gb: 35}
defaults:
  audio:
    dataset: audiocaps
    manifest: "${CAENL_DATA_ROOT:-/dev/shm/caenl-active/data}/audiocaps/manifest.jsonl"
    manifest_min_coverage: 0.60
    manifest_verify_hashes: sample
    max_clips_per_split: 10000
    captioning: {epochs: 10, batch_size: 16, checkpoint_every_steps: 250, metrics: [cider_d, bleu4, rouge_l, meteor, spice, validation_loss], official_metrics: true, java_metrics: true, spice: true}
    retrieval: {epochs: 40, batch_size: 64, checkpoint_every_steps: 250, metrics: [t2a_r1, t2a_r5, t2a_r10, a2t_r1, a2t_r5, a2t_r10, median_rank]}
    monitoring_cadence_steps: 20
  quality_gates: {require_controller_updates: true, minimum_controller_updates: 20}
stages:
  - name: prepare_audiocaps
    type: prepare_data
    cpu_only: true
    parallel: 1
    matrix: {}
    job:
      datasets:
        - {name: audiocaps, options: {download_audio: true, download_workers: 4, max_clips_per_split: 10000, min_coverage: 0.60, cookies: "${CAENL_YTDLP_COOKIES:-}"}}
  - name: captioning
    type: audio_captioning
    depends_on: [prepare_audiocaps]
    parallel: 1
    matrix: {seed: [0, 1, 2], method: [baseline, fixed_dcr, macc_lite, full_macc]}
    expected: {seeds: [0, 1, 2], methods: [baseline, fixed_dcr, macc_lite, full_macc]}
    job: {}
  - name: retrieval
    type: audio_retrieval
    depends_on: [prepare_audiocaps]
    parallel: 1
    matrix: {seed: [0, 1, 2], method: [baseline, fixed_dcr, macc_lite, full_macc]}
    expected: {seeds: [0, 1, 2], methods: [baseline, fixed_dcr, macc_lite, full_macc]}
    job: {}
  - name: aggregate
    type: aggregate
    depends_on: [captioning, retrieval]
    cpu_only: true
    matrix: {}
    job: {}
